<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邀请码申请记录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 24px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { font-size: 22px; margin-bottom: 16px; }
        .btn { display: inline-block; padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; text-decoration: none; border: none; }
        .btn-primary { background: #1a73e8; color: white; }
        .toolbar { margin-bottom: 16px; display: flex; gap: 8px; align-items: center; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #fafafa; font-weight: 500; color: #666; }
        .empty { text-align: center; color: #999; padding: 40px; }
        .back { color: #1a73e8; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 邀请码申请记录</h1>
        <div class="toolbar">
            <a href="/" class="btn btn-primary">← 返回邀请码管理</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>姓名</th>
                    <th>手机号</th>
                    <th>申请时间</th>
                </tr>
            </thead>
            <tbody>
                {% for row in requests %}
                <tr>
                    <td>{{ row.id }}</td>
                    <td>{{ row.name }}</td>
                    <td>{{ row.phone }}</td>
                    <td>{{ row.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
                </tr>
                {% endfor %}
                {% if not requests %}
                <tr><td colspan="4" class="empty">暂无申请记录</td></tr>
                {% endif %}
            </tbody>
        </table>
    </div>
</body>
</html>
