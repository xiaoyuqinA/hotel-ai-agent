<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>酒店评论AI助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      min-height: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #333;
      background: #fff;
    }

    .header {
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .header h1 { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    .header p { font-size: 11px; opacity: 0.85; }

    .content { padding: 16px; }
    .section { margin-bottom: 14px; }
    .section:last-child { margin-bottom: 0; }

    .label { font-size: 12px; color: #999; margin-bottom: 6px; }

    /* 酒店选择 */
    .hotel-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #f5f5f5;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .hotel-selector:hover { background: #eee; }
    .hotel-selector .icon { font-size: 18px; }
    .hotel-selector .name { flex: 1; font-weight: 500; color: #333; }
    .hotel-selector .arrow { color: #999; font-size: 12px; }

    /* 配置项 */
    .config-item {
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .config-item:last-child { border-bottom: none; }
    .config-item .config-label { font-size: 12px; color: #999; margin-bottom: 2px; }
    .config-item .config-value { font-size: 13px; color: #333; line-height: 1.5; }

    /* 输入框 */
    .input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input:focus { border-color: #667eea; }
    .input::placeholder { color: #ccc; }

    .textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      resize: vertical;
      min-height: 60px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .textarea:focus { border-color: #667eea; }
    .textarea::placeholder { color: #ccc; }

    /* 按钮 */
    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #f5f5f5; color: #666; }
    .btn-secondary:hover { background: #eee; }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-row .btn { flex: 1; }

    /* 设置按钮行 */
    .settings-btn {
      background: none;
      border: 1px dashed #ddd;
      border-radius: 8px;
      padding: 8px;
      width: 100%;
      font-size: 13px;
      color: #999;
      cursor: pointer;
      transition: all 0.2s;
    }
    .settings-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }

    /* 状态 */
    .status-text {
      font-size: 12px;
      color: #999;
      padding: 8px 0;
    }
    .status-text.running { color: #52c41a; }
    .status-text.error { color: #ff4d4f; }
    .status-text.success { color: #52c41a; }

    .hidden { display: none; }

    /* 酒店选择弹窗 */
    #hotel-list-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #hotel-list-modal.hidden { display: none; }
    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 20px;
      width: 280px;
      max-height: 300px;
      overflow-y: auto;
    }
    .modal-content h3 { font-size: 15px; margin-bottom: 12px; }
    .modal-hotel-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 4px;
    }
    .modal-hotel-item:hover { background: #f5f5f5; }
    .modal-hotel-item .m-name { font-size: 14px; font-weight: 500; }
    .modal-hotel-item .m-id { font-size: 11px; color: #999; }
    .modal-new-hotel {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      color: #667eea;
      font-weight: 500;
      text-align: center;
      border-top: 1px solid #eee;
      margin-top: 8px;
      padding-top: 12px;
    }
    .modal-new-hotel:hover { background: #f5f5f5; }
  </style>
</head>
<body>
  <div class="header">
    <h1>✦ 酒店评论AI助手</h1>
    <p>智能生成 OTA 评论回复</p>
  </div>

  <div class="content" id="app-content">
    <!-- 由 JS 渲染 -->
  </div>

  <!-- 酒店列表弹窗 -->
  <div id="hotel-list-modal" class="hidden"></div>

  <script src="../popup.js"></script>
</body>
</html>
